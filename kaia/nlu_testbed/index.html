<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NLU testbed</title>
  <style>
    :root {
      --background: #ffffff; --foreground: #09090b;
      --card: #ffffff; --muted: #f4f4f5; --muted-foreground: #71717a;
      --border: #e4e4e7; --ring: #a1a1aa;
      --primary: #18181b; --primary-foreground: #fafafa;
      --accent: #f4f4f5;
      --destructive: #dc2626; --destructive-muted: #fef2f2;
      --live: #16a34a;
      --radius: 10px;
      color-scheme: light;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --background: #09090b; --foreground: #fafafa;
        --card: #0c0c0e; --muted: #18181b; --muted-foreground: #a1a1aa;
        --border: #27272a; --ring: #52525b;
        --primary: #fafafa; --primary-foreground: #18181b;
        --accent: #27272a;
        --destructive: #f87171; --destructive-muted: #2a1215;
        --live: #4ade80;
        color-scheme: dark;
      }
    }
    *, *::before, *::after { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--background); color: var(--foreground);
      font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }

    /* One centered column that fills the screen: header, the scrolling chat, the composer */
    #app {
      height: 100%; max-width: 760px; margin: 0 auto; padding: 16px;
      display: flex; flex-direction: column; gap: 12px;
    }
    header { display: flex; align-items: center; gap: 12px; }
    header h1 { flex: 1; margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }

    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 1px 2px rgb(0 0 0 / 0.04);
    }

    /* The messages come from ChatCommandHandler as <p class="right|left|system|error"> */
    #chat {
      flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      padding: 16px; display: flex; flex-direction: column; gap: 10px;
    }
    #chat > * { flex-shrink: 0; }
    #chat p {
      margin: 0; max-width: 85%; padding: 8px 12px; border-radius: var(--radius);
      overflow-wrap: anywhere; background-image: none !important;
    }
    #chat p.right { align-self: flex-end; background: var(--primary); color: var(--primary-foreground); }
    #chat p.left { align-self: flex-start; background: var(--muted); }
    #chat p.system {
      align-self: stretch; max-width: 100%; background: var(--muted); border: 1px solid var(--border);
      font: 12.5px/1.6 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap;
    }
    #chat p.error {
      align-self: stretch; max-width: 100%; max-height: 9em; overflow: auto;
      background: var(--destructive-muted); color: var(--destructive);
      border: 1px solid color-mix(in srgb, var(--destructive) 30%, transparent);
      font: 12px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; white-space: pre-wrap;
    }
    #chat .chat-details { display: block; margin-top: 4px; font-size: 12px; opacity: 0.7; }

    #composer { display: flex; align-items: flex-end; gap: 8px; padding: 8px; }
    #text {
      flex: 1; min-width: 0; resize: none; height: 40px; max-height: 120px;
      padding: 9px 10px; border: 0; outline: none; background: transparent; color: inherit; font: inherit;
    }
    #text::placeholder { color: var(--muted-foreground); }
    #composer:focus-within { border-color: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 25%, transparent); }

    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px; flex-shrink: 0;
      height: 40px; padding: 0 16px; border-radius: calc(var(--radius) - 2px);
      font: 500 14px/1 inherit; font-family: inherit; cursor: pointer; white-space: nowrap;
      transition: background-color 120ms ease, opacity 120ms ease;
    }
    .btn:focus-visible { outline: 2px solid var(--ring); outline-offset: 2px; }
    .btn-primary { background: var(--primary); color: var(--primary-foreground); border: 1px solid var(--primary); }
    .btn-primary:hover { opacity: 0.9; }
    .btn-outline { background: transparent; color: var(--foreground); border: 1px solid var(--border); }
    .btn-outline:hover { background: var(--accent); }
    .btn-icon { width: 40px; padding: 0; }
    .btn svg { width: 16px; height: 16px; }

    /* The microphone is open or recording */
    .btn-talk.live { color: var(--live); border-color: var(--live); }

    /* DebugViewController of Kaia: the list of the debug views, then the chosen one */
    /* A centered dialog over a dimmed page; the settings button stays above it to close it */
    #debug-div {
      display: none; position: fixed; z-index: 20; inset: 0; margin: auto;
      width: min(560px, calc(100vw - 32px)); height: min(70vh, 640px); padding: 12px; overflow: auto;
      background: var(--card); border: 1px solid var(--border); border-radius: var(--radius);
      box-shadow: 0 0 0 100vmax rgb(0 0 0 / 0.5), 0 10px 30px rgb(0 0 0 / 0.25);
    }
    #debug-settings-btn { position: relative; z-index: 21; background: var(--background); }
    /* MicDebugView puts its buttons above a 100% high iframe */
    #debug-div iframe { height: calc(100% - 44px) !important; border-radius: 6px; }
    .debug-button-component {
      display: block; width: 100%; margin-bottom: 6px; padding: 8px 12px; text-align: left;
      background: transparent; color: var(--foreground); border: 1px solid var(--border);
      border-radius: calc(var(--radius) - 2px); font: inherit; cursor: pointer;
    }
    .debug-button-component:hover { background: var(--accent); }
    #debug-div button:not(.debug-button-component) {
      padding: 4px 10px; background: transparent; color: var(--foreground);
      border: 1px solid var(--border); border-radius: 6px; font: inherit; cursor: pointer;
    }

    @media (max-width: 520px) {
      #app { padding: 10px; }
      #chat p { max-width: 100%; }
      .btn .label { display: none; }
      .btn-talk { width: 40px; padding: 0; }
    }
  </style>
</head>

<body>
  <div id="app">
    <header>
      <h1>NLU testbed</h1>
      <button id="debug-settings-btn" class="btn btn-outline btn-icon" title="Debug views" aria-label="Debug views">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></svg>
      </button>
    </header>

    <div id="chat" class="card"></div>

    <div id="composer" class="card">
      <textarea id="text" rows="1" placeholder="Type a command…"></textarea>
      <button id="talk" class="btn btn-outline btn-talk" title="Open the microphone">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 17v5"/></svg>
        <span class="label">Talk</span>
      </button>
      <button id="send" class="btn btn-primary">
        <span class="label">Send</span>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </div>
  <div id="debug-div"></div>

  <script type="module">
    const v = Math.random().toString(36).slice(2);
    const { AvatarClient, Dispatcher, ChatCommandHandler, TextInputHandler, Microphone, FakeMicrophone, MicController,
            Recorder, StatefulRecorder, SilenceDetector, Automaton, AudioController, Message, Envelop,
            DebugViewController, MicDebugView, ReloadDebugView } =
      await import(`/frontend/scripts/kaia-frontend.js?v=${v}`);

    const params  = new URLSearchParams(window.location.search);
    // ?fake_mic: the recordings are played by SoundInjectionCommand instead of the microphone, for the automated tests
    const fakeMic = params.has('fake_mic');
    const session = params.get('session') ?? 'default';
    const baseUrl = window.location.origin;

    const client     = new AvatarClient({ baseUrl, name: 'web', session });
    const dispatcher = new Dispatcher(client);
    const chatDiv    = document.getElementById('chat');
    const textInput  = document.getElementById('text');
    const sendButton = document.getElementById('send');
    new ChatCommandHandler({ dispatcher, container: chatDiv, baseUrl });
    new TextInputHandler({ input: textInput, button: sendButton, client });
    new AudioController({ dispatcher, baseUrl, silent: fakeMic });

    const debugViewController = new DebugViewController(document.getElementById('debug-settings-btn'), document.getElementById('debug-div'));
    debugViewController.register(new ReloadDebugView());
    debugViewController.register(new MicDebugView({ baseUrl, dispatcher }));

    // TextInputHandler sends on Ctrl+Enter; a plain Enter sends too, Shift+Enter is a new line
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.isComposing) {
        e.preventDefault();
        if (textInput.value.trim() !== '') sendButton.click();
      }
    });

    const talkButton = document.getElementById('talk');

    const input     = fakeMic ? new FakeMicrophone({ sampleRate: 16000, dispatcher, baseUrl }) : new Microphone();
    const recorder  = new Recorder({ startBufferLength: 1.0, normalBufferLength: 0.3, dispatcher, baseUrl });
    const stateful  = new StatefulRecorder({ recorder, dispatcher });
    const silence   = new SilenceDetector({ timeBetweenReportsInSeconds: 0.5, decisionWindowSeconds: 1.0, reportingWindowSeconds: 0.1, silenceLevel: 0.01, dispatcher });
    // No wake word: the microphone is opened by the Talk button
    const automaton = new Automaton({ silenceDetector: silence, wakeWordDetector: null, statefulRecorder: stateful, dispatcher });
    const controller = new MicController(input, m => automaton.process(m));
    // Read from the recorder itself: its state events go through the server and may arrive out of order
    setInterval(() => talkButton.classList.toggle('live', stateful.state !== 'Standby'), 100);

    // The browser gives the microphone and the sound only after a click, so the real microphone starts on the first Talk
    let started = false;
    async function start() {
      if (started) return;
      started = true;
      await controller.start();
    }
    talkButton.addEventListener('click', async () => {
      await start();
      dispatcher.push(new Message('OpenMicCommand', new Envelop(), {}));
    });

    const initMsg = new Message('InitializationEvent', new Envelop(), {});
    await client.push(initMsg);
    client.setLastId(initMsg.envelop.id);
    dispatcher.start();
    textInput.focus();
    if (fakeMic) await start();
  </script>
</body>
</html>
